name: PSS Universal Menu Cache V3

on:
  push:
    branches: [main]
    paths:
      - 'assets/pss-universal-menu-cache-v3.js'
      - '.github/workflows/pss-enable-universal-menu-cache-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Injetar cache universal V3 no frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/pss-universal-menu-cache-v3.js?v=V3_20260810_1758"></script>'
          s=re.sub(r'\n?<script src="assets/pss-universal-menu-cache-v3\.js[^\"]*"[^>]*></script>','',s)
          if '</body>' not in s:
              raise SystemExit('ERRO: </body> nao localizado')
          s=s.replace('</body>',tag+'\n</body>',1)
          if s.count('pss-universal-menu-cache-v3.js')!=1:
              raise SystemExit('ERRO: referencia V3 nao ficou unica')
          if '<!DOCTYPE html>' not in s or '</html>' not in s:
              raise SystemExit('ERRO: HTML invalido')
          p.write_text(s,encoding='utf-8',newline='')
          Path('api').mkdir(exist_ok=True)
          Path('api/menu-performance-status.json').write_text(json.dumps({
            'ok':True,
            'version':'UNIVERSAL_MENU_CACHE_V3',
            'allMenus':True,
            'strategy':'stale-while-revalidate',
            'skeletonBlockedWhenCacheExists':True,
            'updatedAt':'2026-08-10T17:58:00-03:00'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('OK: cache universal V3 injetado')
          PY
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html api/menu-performance-status.json
          git commit -m 'Frontend: todos os menus com cache instantaneo V3 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
