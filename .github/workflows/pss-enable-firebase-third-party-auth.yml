name: PSS Enable Firebase Third Party Auth

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pss-enable-firebase-third-party-auth.yml'

permissions:
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      SUPABASE_PROJECT_REF: nsaoekahczonljpozyvy
    steps:
      - uses: actions/checkout@v4

      - name: Validar secrets sem expor valores
        shell: bash
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo 'ERRO: secret SUPABASE_ACCESS_TOKEN ausente'; missing=1; fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then echo 'ERRO: secret FIREBASE_SERVICE_ACCOUNT_JSON ausente'; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 2; fi

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar configuração Auth no Supabase hospedado
        run: supabase config push --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Preparar Firebase Admin SDK
        run: |
          npm init -y >/dev/null 2>&1
          npm install firebase-admin@latest --no-audit --no-fund

      - name: Aplicar role authenticated aos usuários Firebase
        run: node scripts/firebase-set-authenticated-claim.mjs

      - name: Conclusão
        run: |
          echo 'OK: Firebase Third-Party Auth enviado ao Supabase.'
          echo 'OK: claim role=authenticated aplicada/preservada nos usuários Firebase.'
