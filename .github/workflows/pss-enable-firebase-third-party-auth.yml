name: PSS Enable Firebase Third Party Auth

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pss-enable-firebase-third-party-auth.yml'
      - 'scripts/firebase-set-authenticated-claim.mjs'

permissions:
  contents: read

jobs:
  firebase_claims:
    name: Firebase claims com service account existente
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_TARGET_PROJECT_ID: boloes-loterias-especiais
    steps:
      - uses: actions/checkout@v4

      - name: Validar secret existente
        shell: bash
        run: |
          if [ -z "$GOOGLE_SERVICE_JSON" ]; then
            echo 'ERRO: secret GOOGLE_SERVICE_ACCOUNT_JSON ausente'
            exit 2
          fi

      - name: Preparar Firebase Admin SDK
        run: |
          npm init -y >/dev/null 2>&1
          npm install firebase-admin@latest --no-audit --no-fund

      - name: Aplicar role authenticated aos usuários Firebase
        run: node scripts/firebase-set-authenticated-claim.mjs

  supabase_auth_config:
    name: Publicar configuração Auth no Supabase
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nsaoekahczonljpozyvy
    steps:
      - uses: actions/checkout@v4

      - name: Verificar token Supabase
        id: token
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'ERRO: SUPABASE_ACCESS_TOKEN ausente.'
            exit 2
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar configuração Auth no Supabase hospedado
        run: supabase config push --project-ref "$SUPABASE_PROJECT_REF" --yes
