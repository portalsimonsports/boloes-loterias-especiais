name: PSS switch navigation V2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pss-switch-navigation-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trocar V1 pela V2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="assets/pss-navigation-instant-v1.js?v=V1_20260810_1008"></script>'
          new='<script src="assets/pss-navigation-instant-v2.js?v=V2_20260810_1036"></script>'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('ERRO: referência V1 não localizada e V2 ausente')
          if s.count(new)!=1:
              raise SystemExit('ERRO: referência V2 não ficou única')
          if '<!DOCTYPE html>' not in s or '</html>' not in s:
              raise SystemExit('ERRO: HTML inválido')
          p.write_text(s,encoding='utf-8',newline='')
          Path('api/navigation-version.json').write_text('{"ok":true,"versao":"V2_CACHE_VISUAL","asset":"assets/pss-navigation-instant-v2.js?v=V2_20260810_1036","menus":["boloes","comprovante","pagamentos","usuarios","solicitacoes","baseLoterias","consulta","participantes"]}\n',encoding='utf-8')
          print('OK: V2 ativada')
          PY
      - name: Publicar
        run: |
          rm -f .github/workflows/pss-switch-navigation-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html api/navigation-version.json .github/workflows/pss-switch-navigation-v2.yml
          git commit -m 'Frontend: ativa navegação instantânea V2 com cache visual [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
