name: PSS Apply Runtime Complements

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260810165500_runtime_complementos.sql'
      - '.github/workflows/pss-apply-runtime-complements.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nsaoekahczonljpozyvy
    steps:
      - uses: actions/checkout@v4
      - name: Validar token Supabase
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo 'ERRO: SUPABASE_ACCESS_TOKEN ausente'; exit 2; fi
      - name: Aplicar SQL
        run: |
          jq -Rs '{query:.,read_only:false}' supabase/migrations/20260810165500_runtime_complementos.sql >/tmp/q.json
          CODE=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/q.json)
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then cat /tmp/r.json; exit 3; fi
          echo 'RUNTIME_COMPLEMENTS_OK'
