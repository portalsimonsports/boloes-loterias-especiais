name: PSS debug renderers menus
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pss-debug-renderers-menu.yml'
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mapear funções e navegação
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          out=[]
          # Navegação: trechos contendo data-view/ESTADO.view e chamadas de render
          pats=[r'function\s+navegar\s*\([^)]*\)\s*\{',r'window\.navegar\s*=\s*function\s*\([^)]*\)\s*\{',r'addEventListener\([^\n]{0,120}data-view',r'dataset\.view']
          for pat in pats:
            for m in re.finditer(pat,s,re.I):
              out.append('\n===== NAV @%d =====\n%s'%(m.start(),s[max(0,m.start()-1200):min(len(s),m.start()+6500)]))
          # Funções com nomes ligados aos menus
          palavras=['comprov','pagament','usuario','solicit','baseLoter','consulta','particip','boloe','bolao']
          funpat=re.compile(r'(?:(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\([^)]*\)\s*\{|window\.([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?function\s*\([^)]*\)\s*\{)')
          for m in funpat.finditer(s):
            nome=m.group(1) or m.group(2) or ''
            if any(p.lower() in nome.lower() for p in palavras):
              out.append('\n===== FUN '+nome+' @%d =====\n%s'%(m.start(),s[m.start():min(len(s),m.start()+9000)]))
          Path('api/menu-renderers-debug.txt').write_text('\n'.join(out),encoding='utf-8')
          print('OK',len(out))
          PY
      - name: Publicar debug
        run: |
          rm -f .github/workflows/pss-debug-renderers-menu.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/menu-renderers-debug.txt .github/workflows/pss-debug-renderers-menu.yml
          git commit -m 'Debug: mapear renderizadores de menus [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
