name: Testar Supabase publico

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/testar-supabase-publico.yml'

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar RPCs publicos
        shell: bash
        env:
          SUPABASE_URL: 'https://nsaoekahczonljpozyvy.supabase.co'
          SUPABASE_KEY: 'sb_publishable_nNKxlacE4yTpE5KMFF8spg_-YTLSSIF'
        run: |
          set -euo pipefail
          for rpc in pss_boloes_publicos pss_resultados_publicos pss_configuracoes_publicas; do
            echo "Testando $rpc"
            code=$(curl -sS -o "/tmp/${rpc}.json" -w '%{http_code}' \
              -X POST "$SUPABASE_URL/rest/v1/rpc/$rpc" \
              -H "apikey: $SUPABASE_KEY" \
              -H 'Content-Type: application/json' \
              --data '{}')
            echo "HTTP $code"
            cat "/tmp/${rpc}.json"
            echo
            test "$code" = '200'
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          for nome in ['pss_boloes_publicos','pss_resultados_publicos','pss_configuracoes_publicas']:
              data=json.loads(Path('/tmp/'+nome+'.json').read_text())
              if not isinstance(data,list):
                  raise SystemExit(nome+' nao retornou lista')
              print(nome, 'registros=', len(data))
          boloes=json.loads(Path('/tmp/pss_boloes_publicos.json').read_text())
          if len(boloes) != 5:
              raise SystemExit(f'Esperados 5 boloes, recebidos {len(boloes)}')
          PY
      - name: Remover workflow temporario
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/testar-supabase-publico.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/testar-supabase-publico.yml
          git commit -m 'Supabase: teste publico concluido [skip ci]'
          git push
