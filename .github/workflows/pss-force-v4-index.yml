name: PSS force V4 index
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pss-force-v4-index.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Atualizar bridge para V4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'assets/pss-supabase-bridge\.js(?:\?v=[A-Za-z0-9_\-]+)?'
          achados=re.findall(pattern,s)
          if len(achados)!=1:
              raise SystemExit('ERRO refs bridge='+str(len(achados))+' '+repr(achados))
          novo='assets/pss-supabase-bridge.js?v=V4_BOOTSTRAP_FAST_20260810_0840'
          s2=re.sub(pattern,novo,s,count=1)
          p.write_text(s2,encoding='utf-8',newline='')
          Path('api').mkdir(exist_ok=True)
          Path('api/frontend-version.json').write_text(json.dumps({
            'ok': True,
            'bridge': 'V4_BOOTSTRAP_FAST',
            'asset': novo,
            'atualizadoEm': '10/08/2026 08:40:00'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(achados[0],'->',novo)
          PY
      - name: Publicar V4
        run: |
          rm -f .github/workflows/pss-force-v4-index.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html api/frontend-version.json .github/workflows/pss-force-v4-index.yml
          git commit -m 'Frontend: ativa V4 bootstrap fast [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
