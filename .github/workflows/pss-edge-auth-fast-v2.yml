name: PSS Edge Auth Fast V2

# Manutenção manual apenas.
# Não deve executar em commits automáticos de dados, frontend ou GitHub Pages.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar estado atual do gateway
        run: |
          grep -q "pss-firebase-gateway" <<< "pss-firebase-gateway"
          test -f supabase/functions/pss-firebase-gateway/index.ts
          echo "EDGE_AUTH_FAST_MANUAL_OK"
