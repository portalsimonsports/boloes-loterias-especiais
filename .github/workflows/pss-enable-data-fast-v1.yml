name: PSS Enable Data Fast V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pss-enable-data-fast-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inserir apenas a camada rápida de dados
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/pss-data-fast-supabase-v1.js?v=V1_20260810_2241" data-pss-data-fast="1"></script>'
          if tag not in s:
              if '</body>' not in s: raise SystemExit('ERRO: body não localizado')
              s=s.replace('</body>',tag+'\n</body>',1)
          if s.count(tag)!=1: raise SystemExit('ERRO: tag duplicada')
          if '<!DOCTYPE html>' not in s or '</html>' not in s: raise SystemExit('ERRO: HTML inválido')
          p.write_text(s,encoding='utf-8',newline='')
          print('DATA_FAST_TAG_OK')
          PY
      - name: Publicar
        shell: bash
        run: |
          rm -f .github/workflows/pss-enable-data-fast-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/pss-enable-data-fast-v1.yml
          git commit -m 'Performance: ativa Supabase rápido sem alterar layout [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
