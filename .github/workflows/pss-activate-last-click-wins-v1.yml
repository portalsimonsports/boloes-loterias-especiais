name: PSS Activate Last Click Wins V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/pss-last-click-wins-v1.js'
      - '.github/workflows/pss-activate-last-click-wins-v1.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Injetar controlador por ultimo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*<script[^>]+pss-last-click-wins-v1\.js[^>]*></script>\s*','\n',s,flags=re.I)
          tag='\n<script src="assets/pss-last-click-wins-v1.js?v=V5_20260812_1648"></script>\n'
          if '</body>' not in s.lower():
              raise SystemExit('index.html sem </body>')
          pos=s.lower().rfind('</body>')
          s=s[:pos]+tag+s[pos:]
          p.write_text(s,encoding='utf-8')
          if s.lower().rfind('pss-last-click-wins-v1.js') > s.lower().rfind('</body>'):
              raise SystemExit('tag fora do body')
          print('LAST_CLICK_WINS_V5_INJETADO')
          PY
      - name: Validar
        run: |
          grep -q 'pss-last-click-wins-v1.js?v=V5_20260812_1648' index.html
          test "$(grep -o 'pss-last-click-wins-v1.js' index.html | wc -l)" -eq 1
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Sem alteracoes'
            exit 0
          fi
          git commit -m 'Frontend: ativa navegacao rapida V5'
          git push
