name: PSS Activate Last Click Wins V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/pss-last-click-wins-v1.js'
      - '.github/workflows/pss-activate-last-click-wins-v1.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corrigir somente Palpite e ativar V7
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          a=Path('assets/pss-last-click-wins-v1.js')
          s=a.read_text(encoding='utf-8')
          old='var lista=await boloesRapido();'
          new="var lista=await edge('boloes',{palpiteMenu:true});lista=Array.isArray(lista)?lista:[];window.ESTADO=window.ESTADO||{};ESTADO.boloes=lista;"
          if old not in s and new not in s:
              raise SystemExit('Ponto do Palpite nao localizado')
          if old in s:
              s=s.replace(old,new,1)
          s=s.replace('Navegação rápida V6','Navegação rápida V7',1)
          s=s.replace('window.PSS_LAST_CLICK_WINS_V6','window.PSS_LAST_CLICK_WINS_V7')
          s=s.replace('PSS_NAV_FAST_V6','PSS_NAV_FAST_V7')
          s=s.replace('PSS_PALPITE_FAST_V6','PSS_PALPITE_FAST_V7')
          s=s.replace("version:'V6'","version:'V7'")
          a.write_text(s,encoding='utf-8')

          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          h=re.sub(r'\s*<script[^>]+pss-last-click-wins-v1\.js[^>]*></script>\s*','\n',h,flags=re.I)
          tag='\n<script src="assets/pss-last-click-wins-v1.js?v=V7_PALPITE_EDGE_DIRETO_20260813_0605"></script>\n'
          if '</body>' not in h.lower():
              raise SystemExit('index.html sem </body>')
          pos=h.lower().rfind('</body>')
          h=h[:pos]+tag+h[pos:]
          p.write_text(h,encoding='utf-8')
          print('PALPITE_V7_EDGE_DIRETO_OK')
          PY
      - name: Validar
        run: |
          grep -q "edge('boloes',{palpiteMenu:true})" assets/pss-last-click-wins-v1.js
          grep -q 'pss-last-click-wins-v1.js?v=V7_PALPITE_EDGE_DIRETO_20260813_0605' index.html
          test "$(grep -o 'pss-last-click-wins-v1.js' index.html | wc -l)" -eq 1
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pss-last-click-wins-v1.js index.html
          if git diff --cached --quiet; then
            echo 'Sem alteracoes'
            exit 0
          fi
          git commit -m 'Palpite: usa Supabase Edge direto'
          git push
