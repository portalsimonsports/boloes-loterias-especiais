name: PSS Activate Last Click Wins V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/pss-last-click-wins-v1.js'
      - 'assets/pss-admin-edge-fast-v1.js'
      - '.github/workflows/pss-activate-last-click-wins-v1.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar clique direto nos 4 menus lentos
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          a=Path('assets/pss-last-click-wins-v1.js')
          s=a.read_text(encoding='utf-8')

          # Mantém o mesmo transporte que já funciona em Usuários.
          s=s.replace("var lista=await edge('boloes',{palpiteMenu:true});lista=Array.isArray(lista)?lista:[];window.ESTADO=window.ESTADO||{};ESTADO.boloes=lista;",
                      "var lista=await pssStableCall('boloes');lista=Array.isArray(lista)?lista:[];window.ESTADO=window.ESTADO||{};ESTADO.boloes=lista;",1)
          s=s.replace("if(a==='BASE_LOTERIAS')return baseLoteriasTabela(await edge('base_loterias'));",
                      "if(a==='BASE_LOTERIAS')return baseLoteriasTabela(await pssStableCall('base_loterias'));",1)
          s=s.replace("var d=await edge('consulta',{lista:true}),ps=(d&&d.participantes)||[];",
                      "var d=await pssStableCall('consulta'),ps=(d&&d.participantes)||[];",1)

          # Intercepta somente os quatro botões antes do navegador legado.
          handler = r'''
function instalarCliquesDiretos4(){
  if(window.PSS_CLIQUE_DIRETO_4_V9)return;
  window.PSS_CLIQUE_DIRETO_4_V9=true;
  document.addEventListener('click',function(ev){
    var b=ev.target&&ev.target.closest?ev.target.closest('#navMenu button[data-view]'):null;
    if(!b)return;
    var v=String(b.dataset.view||'');
    if(['palpite','pagamentos','baseLoterias','consulta'].indexOf(v)<0)return;
    ev.preventDefault();
    ev.stopPropagation();
    if(typeof ev.stopImmediatePropagation==='function')ev.stopImmediatePropagation();
    go(v);
  },true);
}
'''
          if 'function instalarCliquesDiretos4()' not in s:
              anchor='var renderMap={'
              if anchor not in s: raise SystemExit('renderMap nao localizado')
              s=s.replace(anchor,handler+'\n'+anchor,1)

          s=s.replace('function install(){instalarLoaders();instalarPalpiteRapido();instalarConfigRapido();instalarPagamentosRapido();instalarConsultaDireta();instalarAdminDados();instalarApi();instalarNavegacao();}',
                      'function install(){instalarLoaders();instalarPalpiteRapido();instalarConfigRapido();instalarPagamentosRapido();instalarConsultaDireta();instalarAdminDados();instalarApi();instalarNavegacao();instalarCliquesDiretos4();}',1)
          s=s.replace('Navegação rápida V8','Navegação rápida V9',1)
          s=s.replace('window.PSS_LAST_CLICK_WINS_V8','window.PSS_LAST_CLICK_WINS_V9')
          s=s.replace('PSS_NAV_FAST_V8','PSS_NAV_FAST_V9')
          s=s.replace('PSS_PALPITE_FAST_V8','PSS_PALPITE_FAST_V9')
          s=s.replace("version:'V8'","version:'V9'")
          a.write_text(s,encoding='utf-8')

          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          h=re.sub(r'\s*<script[^>]+pss-last-click-wins-v1\.js[^>]*></script>\s*','\n',h,flags=re.I)
          tag='\n<script src="assets/pss-last-click-wins-v1.js?v=V9_CLIQUE_DIRETO_4_20260814_0556"></script>\n'
          if '</body>' not in h.lower(): raise SystemExit('index.html sem </body>')
          pos=h.lower().rfind('</body>')
          h=h[:pos]+tag+h[pos:]
          p.write_text(h,encoding='utf-8')
          print('V9_CLIQUE_DIRETO_4_OK')
          PY

      - name: Validar
        run: |
          grep -q 'function instalarCliquesDiretos4()' assets/pss-last-click-wins-v1.js
          grep -q "\['palpite','pagamentos','baseLoterias','consulta'\]" assets/pss-last-click-wins-v1.js
          grep -q "pssStableCall('boloes')" assets/pss-last-click-wins-v1.js
          grep -q "pssStableCall('pagamentos')" assets/pss-last-click-wins-v1.js
          grep -q "pssStableCall('base_loterias')" assets/pss-last-click-wins-v1.js
          grep -q "pssStableCall('consulta')" assets/pss-last-click-wins-v1.js
          grep -q 'V9_CLIQUE_DIRETO_4_20260814_0556' index.html
          test "$(grep -o 'pss-last-click-wins-v1.js' index.html | wc -l)" -eq 1

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add assets/pss-last-click-wins-v1.js index.html
          if git diff --cached --quiet; then
            echo 'Sem alteracoes'
            exit 0
          fi
          git commit -m 'Performance: clique direto nos 4 menus lentos'
          git push
