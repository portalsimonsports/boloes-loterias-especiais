name: PSS Activate Last Click Wins V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/pss-last-click-wins-v1.js'
      - 'assets/pss-admin-edge-fast-v1.js'
      - '.github/workflows/pss-activate-last-click-wins-v1.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publicar V9 dos 4 menus no index
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          a=Path('assets/pss-last-click-wins-v1.js')
          s=a.read_text(encoding='utf-8')

          # Confirma que a V9 e o clique direto já estão no arquivo atual.
          obrigatorios=[
            'window.PSS_LAST_CLICK_WINS_V9',
            'function instalarCliquesDiretos4()',
            "pssStableCall('boloes')",
            "pssStableCall('pagamentos')",
            "pssStableCall('base_loterias')",
            "pssStableCall('consulta')"
          ]
          faltando=[x for x in obrigatorios if x not in s]
          if faltando:
              raise SystemExit('V9 incompleta: '+', '.join(faltando))

          # Não reescreve lógica. Apenas troca a URL carregada pelo index.
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          h=re.sub(r'\s*<script[^>]+pss-last-click-wins-v1\.js[^>]*></script>\s*','\n',h,flags=re.I)
          tag='\n<script src="assets/pss-last-click-wins-v1.js?v=V9_CLIQUE_DIRETO_4_20260814_0838"></script>\n'
          if '</body>' not in h.lower():
              raise SystemExit('index.html sem </body>')
          pos=h.lower().rfind('</body>')
          h=h[:pos]+tag+h[pos:]
          p.write_text(h,encoding='utf-8')
          print('V9_PUBLICADA_NO_INDEX_OK')
          PY

      - name: Validar
        run: |
          grep -q 'function instalarCliquesDiretos4()' assets/pss-last-click-wins-v1.js
          grep -q "pssStableCall('boloes')" assets/pss-last-click-wins-v1.js
          grep -q "pssStableCall('pagamentos')" assets/pss-last-click-wins-v1.js
          grep -q "pssStableCall('base_loterias')" assets/pss-last-click-wins-v1.js
          grep -q "pssStableCall('consulta')" assets/pss-last-click-wins-v1.js
          grep -q 'V9_CLIQUE_DIRETO_4_20260814_0838' index.html
          test "$(grep -o 'pss-last-click-wins-v1.js' index.html | wc -l)" -eq 1

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Sem alteracoes'
            exit 0
          fi
          git commit -m 'Frontend: publica V9 dos 4 menus rápidos'
          git push
