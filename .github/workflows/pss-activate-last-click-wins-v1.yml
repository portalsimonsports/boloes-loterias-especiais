name: PSS Activate Last Click Wins V1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'assets/pss-last-click-wins-v1.js'
      - '.github/workflows/pss-activate-last-click-wins-v1.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir quatro menus e publicar V10
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          asset = Path('assets/pss-last-click-wins-v1.js')
          s = asset.read_text(encoding='utf-8')

          old = "function go(v){v=String(v||'inicio');mark(v);var fn=renderMap[v];if(typeof fn==='function')return fn();if(typeof baseNavigate==='function')return baseNavigate(v);}"
          new = "function rearmar4(v){\n  if(v==='palpite'){instalarPalpiteRapido();}\n  else if(v==='pagamentos'){instalarPagamentosRapido();instalarAdminDados();instalarApi();}\n  else if(v==='baseLoterias'){instalarAdminDados();instalarApi();}\n  else if(v==='consulta'){instalarConsultaDireta();}\n}\nfunction go(v){v=String(v||'inicio');rearmar4(v);mark(v);var fn=renderMap[v];if(typeof fn==='function')return fn();if(typeof baseNavigate==='function')return baseNavigate(v);}"

          if 'function rearmar4(v)' not in s:
              if old not in s:
                  raise SystemExit('go(v) atual nao localizado')
              s = s.replace(old, new, 1)

          s = s.replace("version:'V9'", "version:'V10_REARM_4'")
          asset.write_text(s, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          h = re.sub(r'\s*<script[^>]+pss-last-click-wins-v1\.js[^>]*></script>\s*', '\n', h, flags=re.I)
          tag = '\n<script src="assets/pss-last-click-wins-v1.js?v=V10_REARM_4_20260814_1945"></script>\n'
          pos = h.lower().rfind('</body>')
          if pos < 0:
              raise SystemExit('index.html sem </body>')
          h = h[:pos] + tag + h[pos:]
          index.write_text(h, encoding='utf-8')
          PY

      - name: Validar correção
        shell: bash
        run: |
          grep -q "function rearmar4(v)" assets/pss-last-click-wins-v1.js
          grep -q "v==='palpite'" assets/pss-last-click-wins-v1.js
          grep -q "v==='pagamentos'" assets/pss-last-click-wins-v1.js
          grep -q "v==='baseLoterias'" assets/pss-last-click-wins-v1.js
          grep -q "v==='consulta'" assets/pss-last-click-wins-v1.js
          grep -q "V10_REARM_4_20260814_1945" index.html
          test "$(grep -o 'pss-last-click-wins-v1.js' index.html | wc -l)" -eq 1

      - name: Commit da publicação
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add assets/pss-last-click-wins-v1.js index.html
          if git diff --cached --quiet; then
            echo 'Sem alteracoes'
            exit 0
          fi
          git commit -m 'Frontend: publica correção dos 4 menus V10'
          git push
