name: PSS debug CFG V342
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pss-debug-cfg-v342.yml'
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair V342
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['function carregarCfgV342','async function carregarCfgV342','carregarCfgV342=','window.carregarCfgV342','renderConfigBoloesAdmin = async']
          out=[]
          for term in terms:
            i=s.find(term)
            out.append('\n===== '+term+' =====\n')
            if i<0:
              out.append('NAO ENCONTRADO\n')
            else:
              a=max(0,i-2000); b=min(len(s),i+12000)
              out.append(s[a:b])
          Path('api/debug-cfg-v342.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Publicar
        run: |
          rm -f .github/workflows/pss-debug-cfg-v342.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/debug-cfg-v342.txt .github/workflows/pss-debug-cfg-v342.yml
          git commit -m 'Debug: extrai carregador CONFIG V342 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
