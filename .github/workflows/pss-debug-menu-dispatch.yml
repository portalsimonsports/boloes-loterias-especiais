name: PSS debug menu dispatcher
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pss-debug-menu-dispatch.yml'
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extrair dispatcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          termos=["v==='comprovante'","v==='pagamentos'","v==='usuarios'","v==='solicitacoes'","v==='baseLoterias'","v==='consulta'","v==='participantes'","v==='boloes'","case 'comprovante'","case 'pagamentos'","case 'usuarios'","case 'solicitacoes'","case 'baseLoterias'","case 'consulta'","case 'participantes'","case 'boloes'","case \"comprovante\"","case \"pagamentos\""]
          out=[]
          for t in termos:
            start=0
            while True:
              i=s.find(t,start)
              if i<0: break
              out.append('\n===== '+t+' @'+str(i)+' =====\n'+s[max(0,i-1800):min(len(s),i+5000)])
              start=i+len(t)
          Path('api/menu-dispatch-debug.txt').write_text('\n'.join(out),encoding='utf-8')
          print('OK',len(out))
          PY
      - name: Publicar
        run: |
          rm -f .github/workflows/pss-debug-menu-dispatch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/menu-dispatch-debug.txt .github/workflows/pss-debug-menu-dispatch.yml
          git commit -m 'Debug: dispatcher dos menus [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
