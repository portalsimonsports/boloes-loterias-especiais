name: PSS Force Router V2 Refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pss-force-router-v2-refresh.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Forcar nova versao do roteador sem alterar layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pat=r'<script src="assets/pss-data-fast-router-v2\.js\?v=[^"]+"></script>'
          novo='<script src="assets/pss-data-fast-router-v2.js?v=V2_20260811_0602_FIX401"></script>'
          if not re.search(pat,s):
              raise SystemExit('ERRO_TAG_ROUTER_NAO_LOCALIZADA')
          s,n=re.subn(pat,novo,s,count=1)
          if n!=1: raise SystemExit('ERRO_SUBSTITUICAO_ROUTER')
          p.write_text(s,encoding='utf-8',newline='')
          print('ROUTER_V2_CACHE_BUST_OK')
          PY
      - name: Publicar
        run: |
          rm -f .github/workflows/pss-force-router-v2-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/pss-force-router-v2-refresh.yml
          git commit -m 'Performance: força Router V2 corrigido no navegador [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
