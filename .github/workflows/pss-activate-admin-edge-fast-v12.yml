name: PSS Activate Admin Edge Fast V1.4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_inscritos_inicio_v14.py'
      - '.github/workflows/pss-activate-admin-edge-fast-v12.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch do contador
        run: python scripts/patch_inscritos_inicio_v14.py

      - name: Validar contador e isolamento
        run: |
          grep -q 'function instalarContadorInscritosSupabase()' assets/pss-admin-edge-fast-v1.js
          grep -q "call('usuarios'" assets/pss-admin-edge-fast-v1.js
          grep -q 'totalAprovadosSupabase' assets/pss-admin-edge-fast-v1.js
          grep -q 'V1_4_INSCRITOS_SUPABASE_20260814_2025' index.html
          grep -q 'function instalarResultadosPublicosJson()' assets/pss-admin-edge-fast-v1.js
          grep -q 'V10_REARM_4_20260814_1945' index.html

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pss-admin-edge-fast-v1.js index.html
          if git diff --cached --quiet; then
            echo 'Sem alteracoes'
            exit 0
          fi
          git commit -m 'Inicio: exibe inscritos aprovados via Supabase'
          git push
