name: PSS Activate Admin Edge Fast V1.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/pss-admin-edge-fast-v1.js'
      - '.github/workflows/pss-activate-admin-edge-fast-v12.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar letreiro publico sem alterar menus
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          a=Path('assets/pss-admin-edge-fast-v1.js')
          s=a.read_text(encoding='utf-8')
          marker='function instalar(){instalarApiMulti();instalarApi();instalarPagamentosDireto();instalarParticipantesDireto();}'
          if marker not in s and 'function instalarResultadosPublicosJson()' not in s:
              raise SystemExit('Marcador do Admin Edge nao localizado')

          if 'function instalarResultadosPublicosJson()' not in s:
              lines=[
                'function instalarResultadosPublicosJson(){',
                "  var atual=window.carregarLetreiroResultadosPublicosV213;",
                "  if(typeof atual!=='function')return false;",
                '  if(atual.__PSS_RESULTADOS_JSON_V13)return true;',
                '  var base=atual;',
                '  var fn=async function(forcar){',
                '    try{',
                "      var url='./dados-publicos.json?v='+(forcar?Date.now():'RESULTADOS_JSON_V13_20260814_2000');",
                "      var r=await fetch(url,{cache:forcar?'no-store':'no-cache'});",
                "      if(!r.ok)throw new Error('dados-publicos HTTP '+r.status);",
                '      var j=await r.json();',
                '      var d=j&&j.resultadosPublicos;',
                '      var valido=!!(d&&((Array.isArray(d.resultados)&&d.resultados.length)||d.letreiroTexto));',
                "      if(!valido)throw new Error('resultadosPublicos ausente');",
                "      try{localStorage.setItem('PSS_RESULTADOS_PUBLICOS_V213',JSON.stringify({ts:Date.now(),dados:d}));}catch(e){}",
                "      if(typeof window.renderLetreiroResultadosPublicosV213==='function'){",
                '        window.renderLetreiroResultadosPublicosV213(d);',
                '        return d;',
                '      }',
                '      return base.apply(this,arguments);',
                '    }catch(err){',
                '      return base.apply(this,arguments);',
                '    }',
                '  };',
                '  fn.__PSS_RESULTADOS_JSON_V13=true;',
                '  fn.__base=base;',
                '  window.carregarLetreiroResultadosPublicosV213=fn;',
                '  try{carregarLetreiroResultadosPublicosV213=fn;}catch(e){}',
                '  return true;',
                '}',
                '',
                'function iniciarResultadosPublicosJson(){',
                '  if(!instalarResultadosPublicosJson())return;',
                "  var box=document.getElementById('resultadosPublicosTickerV213');",
                "  if(box&&typeof window.carregarLetreiroResultadosPublicosV213==='function'){",
                '    window.carregarLetreiroResultadosPublicosV213(false).catch(function(){});',
                '  }',
                '}',
                ''
              ]
              bloco='\n'.join(lines)
              novo=bloco+'function instalar(){instalarApiMulti();instalarApi();instalarPagamentosDireto();instalarParticipantesDireto();instalarResultadosPublicosJson();}'
              s=s.replace(marker,novo,1)

          old='instalar();[50,150,400,1000,2500,5000].forEach(function(ms){setTimeout(instalar,ms);});'
          new=old+'[0,100,300,800,1600,3000].forEach(function(ms){setTimeout(iniciarResultadosPublicosJson,ms);});'
          if old in s and 'setTimeout(iniciarResultadosPublicosJson' not in s:
              s=s.replace(old,new,1)
          a.write_text(s,encoding='utf-8')

          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          if 'V10_REARM_4_20260814_1945' not in h:
              raise SystemExit('V10 dos quatro menus nao localizada; abortando')
          pat=r"assets/pss-admin-edge-fast-v1\.js\?v=[^\"']+"
          rep='assets/pss-admin-edge-fast-v1.js?v=V1_3_RESULTADOS_PUBLICOS_20260814_2000'
          if re.search(pat,h):
              h=re.sub(pat,rep,h)
          else:
              pos=h.lower().rfind('</body>')
              if pos<0: raise SystemExit('index sem body')
              h=h[:pos]+'\n<script src="'+rep+'"></script>\n'+h[pos:]
          p.write_text(h,encoding='utf-8')
          PY

      - name: Validar isolamento
        shell: bash
        run: |
          grep -q 'function instalarResultadosPublicosJson()' assets/pss-admin-edge-fast-v1.js
          grep -q 'j&&j.resultadosPublicos' assets/pss-admin-edge-fast-v1.js
          grep -q './dados-publicos.json' assets/pss-admin-edge-fast-v1.js
          grep -q 'V1_3_RESULTADOS_PUBLICOS_20260814_2000' index.html
          grep -q 'V10_REARM_4_20260814_1945' index.html

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pss-admin-edge-fast-v1.js index.html
          if git diff --cached --quiet; then
            echo 'Sem alteracoes'
            exit 0
          fi
          git commit -m 'Publico: restaura letreiro via dados-publicos sem alterar menus'
          git push
