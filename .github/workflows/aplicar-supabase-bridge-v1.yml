name: Aplicar Supabase Bridge V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-supabase-bridge-v1.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar bridge
        shell: bash
        run: |
          test -s assets/pss-supabase-bridge.js
          node --check assets/pss-supabase-bridge.js

      - name: Inserir bridge no index sem reescrever a aplicação
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          script = '  <script src="assets/pss-supabase-bridge.js?v=V1_SUPABASE_FIRST_FALLBACK_LEGACY"></script>\n'

          if len(text.encode('utf-8')) < 100_000:
              raise SystemExit('index.html inesperadamente pequeno; alteração cancelada.')
          if '<!DOCTYPE html>' not in text or '</html>' not in text:
              raise SystemExit('Estrutura HTML principal não validada.')
          if text.count('</body>') != 1:
              raise SystemExit('Fechamento </body> não é único; alteração cancelada.')

          if 'assets/pss-supabase-bridge.js' not in text:
              text = text.replace('</body>', script + '</body>', 1)

          if text.count('assets/pss-supabase-bridge.js') != 1:
              raise SystemExit('Bridge ausente ou duplicada após patch.')
          if '</html>' not in text:
              raise SystemExit('HTML final inválido.')

          path.write_text(text, encoding='utf-8', newline='')
          print('Index validado:', len(text.encode('utf-8')), 'bytes')
          PY

      - name: Publicar patch e remover workflow temporário
        shell: bash
        run: |
          rm -f .github/workflows/aplicar-supabase-bridge-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/aplicar-supabase-bridge-v1.yml
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'Frontend: ativa bridge Supabase-first com fallback legado [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
