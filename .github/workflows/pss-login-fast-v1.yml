name: PSS Login Fast V1
on:
  push:
    branches: [main]
    paths:
      - 'assets/pss-login-fast-v1.js'
      - '.github/workflows/pss-login-fast-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inserir script de login rápido
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/pss-login-fast-v1.js?v=V1_20260811_0625"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>', 1)
          p.write_text(s,encoding='utf-8',newline='')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Login: ativa validação Firebase REST direta [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
