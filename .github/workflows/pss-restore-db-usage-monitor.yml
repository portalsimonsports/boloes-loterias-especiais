name: PSS Restore DB Usage Monitor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pss-restore-db-usage-monitor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recolocar monitor Supabase na CONFIG sem alterar layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/pss-db-usage-monitor-v2.js?v=V2_20260811_0528"></script>'
          # remove versões antigas/duplicadas do monitor
          import re
          s=re.sub(r'\s*<script[^>]+pss-db-usage-monitor-v2\.js[^>]*></script>','',s)
          if '</body>' not in s:
              raise SystemExit('ERRO: </body> nao localizado')
          s=s.replace('</body>',tag+'\n</body>',1)
          if s.count('pss-db-usage-monitor-v2.js') != 1:
              raise SystemExit('ERRO: monitor nao ficou unico')
          if '<!DOCTYPE html>' not in s or '</html>' not in s:
              raise SystemExit('ERRO: HTML invalido')
          p.write_text(s,encoding='utf-8',newline='')
          print('DB_USAGE_MONITOR_RESTAURADO')
          PY
      - name: Publicar
        run: |
          rm -f .github/workflows/pss-restore-db-usage-monitor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/pss-restore-db-usage-monitor.yml
          git commit -m 'CONFIG: restaura monitor de consumo Supabase [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
