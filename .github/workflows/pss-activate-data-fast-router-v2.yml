name: PSS Activate Data Fast Router V2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pss-activate-data-fast-router-v2.yml'
      - 'assets/pss-data-fast-router-v2.js'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ativar roteador V2 sem alterar layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/pss-data-fast-router-v2.js?v=V2_20260811_0421"></script>'
          if tag not in s:
              if '</body>' not in s: raise SystemExit('ERRO_BODY_NAO_LOCALIZADO')
              s=s.replace('</body>',tag+'\n</body>',1)
          if s.count(tag)!=1: raise SystemExit('ERRO_TAG_DUPLICADA')
          p.write_text(s,encoding='utf-8',newline='')
          print('DATA_FAST_ROUTER_V2_ATIVO')
          PY
      - name: Publicar
        run: |
          rm -f .github/workflows/pss-activate-data-fast-router-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/pss-activate-data-fast-router-v2.yml
          git commit -m 'Performance: ativa roteamento direto Supabase V2 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
