name: PSS cache bust Supabase
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pss-cache-bust-supabase.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Atualizar somente a versao da bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'assets/pss-supabase-bridge\.js\?v=[A-Za-z0-9_\-]+'
          achados=re.findall(pattern,s)
          if len(achados)!=1:
              raise SystemExit('Quantidade inesperada de referencias da bridge: '+str(len(achados)))
          novo='assets/pss-supabase-bridge.js?v=V2_CONFIG_SUPABASE_FIRST_20260810_0636'
          s=re.sub(pattern,novo,s,count=1)
          if s.count(novo)!=1 or '<!DOCTYPE html>' not in s or '</html>' not in s:
              raise SystemExit('Validacao final falhou')
          p.write_text(s,encoding='utf-8',newline='')
          print('OK: cache bust aplicado')
          PY
      - name: Publicar
        run: |
          rm -f .github/workflows/pss-cache-bust-supabase.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/pss-cache-bust-supabase.yml
          git commit -m 'Frontend: corrige cache da bridge Supabase [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
