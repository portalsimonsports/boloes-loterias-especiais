name: PSS debug menus lentos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pss-debug-menu-lento.yml'
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extrair trechos dos menus
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          termos=['comprovante','pagamentos','usuarios','solicitacoes','solicitações','base loterias','base_loterias','participantes','boloes','bolões','navegar=function','window.navegar','data-view']
          out=[]
          low=s.lower()
          for termo in termos:
              start=0; n=0
              t=termo.lower()
              while True:
                  i=low.find(t,start)
                  if i<0: break
                  n+=1
                  a=max(0,i-1800); b=min(len(s),i+3500)
                  out.append('\n===== '+termo+' #'+str(n)+' @'+str(i)+' =====\n'+s[a:b])
                  start=i+len(t)
                  if n>=12: break
          Path('api/menu-lento-debug.txt').write_text('\n'.join(out),encoding='utf-8')
          print('OK',len(out),'trechos')
          PY
      - name: Publicar debug
        run: |
          rm -f .github/workflows/pss-debug-menu-lento.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/menu-lento-debug.txt .github/workflows/pss-debug-menu-lento.yml
          git commit -m 'Debug: fluxos dos menus lentos [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
