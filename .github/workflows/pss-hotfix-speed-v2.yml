name: PSS Hotfix Speed V2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pss-hotfix-speed-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar hotfix de velocidade
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Pagamentos: duas leituras Edge em paralelo, não sequenciais.
          p=Path('assets/pss-admin-edge-fast-v1.js')
          s=p.read_text(encoding='utf-8')
          old="var p=pagamentos(await call('pagamentos',false));var r=recebimentos(await call('dados_recebimento',false));"
          new="var _pr=await Promise.all([call('pagamentos',false),call('dados_recebimento',false)]);var p=pagamentos(_pr[0]);var r=recebimentos(_pr[1]);"
          if old in s:
              s=s.replace(old,new)
          s=s.replace("version:'V1.4'","version:'V1.5'")
          s=s.replace('EDGE_FAST_V14','EDGE_FAST_V15')
          p.write_text(s,encoding='utf-8')

          # 2) Forçar navegador a carregar as versões novas sem alterar layout.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'assets/pss-last-click-wins-v1\.js\?v=[^"\']+',
                   'assets/pss-last-click-wins-v1.js?v=V2_20260812_1158',s)
          s=re.sub(r'assets/pss-admin-edge-fast-v1\.js\?v=[^"\']+',
                   'assets/pss-admin-edge-fast-v1.js?v=V15_20260812_1158',s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: |
          grep -q 'V2_20260812_1158' index.html
          grep -q 'V15_20260812_1158' index.html
          grep -q "Promise.all(\[call('pagamentos',false),call('dados_recebimento',false)\])" assets/pss-admin-edge-fast-v1.js
      - name: Commit
        run: |
          git config user.name 'portalsimonsports'
          git config user.email 'portalsimonsports@users.noreply.github.com'
          git add index.html assets/pss-admin-edge-fast-v1.js
          git diff --cached --quiet && exit 0
          git commit -m 'Performance: navegação V2 e pagamentos Edge paralelo'
          git push
